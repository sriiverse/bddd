          <h1 style="font-weight: 500; font-size: 2.4rem; margin: 1.5rem 0">Happy Birthday.</h1>
          <p>Maya,</p>
          <p>
            today isn't really about saying everything perfectly. It's simply about reminding you that you are worth celebrating.
          </p>
          <p>
            Birthdays have a strange way of reminding us how quickly time moves. Somewhere between ordinary days and the things we never quite figured out how to say, memories were made. Maybe not every chapter is meant to be perfectly written. None of that takes away from the beauty of the moments that were real.
          </p>
          <p>I hope the coming year is gentle with you.</p>
